name: Android CI Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant Execute Permissions
      run: chmod +x gradlew

    - name: Create Debug Keystore
      run: |
        mkdir -p ~/.android
        keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" -noprompt

    - name: Compile APK
      run: ./gradlew assembleUniversalGmsDebug --no-daemon -x validateSigningUniversalGmsDebug

    - name: Upload Finished APK
      uses: actions/upload-artifact@v4
      with:
        name: MusicbyLaxmikant
        path: "**/build/outputs/apk/**/*.apk"
